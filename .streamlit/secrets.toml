# .streamlit/secrets.toml
# You need to paste the FULL contents of your Google Service Account JSON key below.
# The string you provided "69ea587065d1f0279d6feb21dd3609f33f534981" is just the private_key_id.
# Open the JSON file you downloaded from Google Cloud Console and copy all of its text.
# Replace the placeholder text below with the actual JSON text.

[connections.gsheets]
type = "service_account"
project_id = "your-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR-PRIVATE-KEY\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account-email@your-project-id.iam.gserviceaccount.com"
client_id = "your-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account-email"
